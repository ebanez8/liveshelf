name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish Windows build
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LiveShelf.sln

      - name: Build
        run: dotnet build LiveShelf.sln --configuration Release --no-restore

      - name: Smoke tests
        run: dotnet run --configuration Release --project tests\LiveShelf.SmokeTests\LiveShelf.SmokeTests.csproj

      - name: Publish win-x64
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart("v");
          dotnet publish src\LiveShelf\LiveShelf.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:Version="$version" `
          -p:PublishDir="${{ github.workspace }}\artifacts\publish\LiveShelf-win-x64\"

      - name: Verify package contents
        shell: pwsh
        run: |
          $publish = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\LiveShelf-win-x64"
          foreach ($name in @("LiveShelf.exe", "liveshelf-agent.exe", "liveshelf-bridge.exe")) {
            $path = Join-Path $publish $name
            if (!(Test-Path -LiteralPath $path)) {
              throw "Missing release file: $name"
            }
          }
          if (Get-ChildItem -LiteralPath $publish -Filter *.pdb -Recurse) {
            throw "Release package should not contain PDB files"
          }
          foreach ($name in @("createdump.exe", "mscordbi.dll", "mscordaccore.dll")) {
            if (Test-Path -LiteralPath (Join-Path $publish $name)) {
              throw "Release package should not contain diagnostic runtime file: $name"
            }
          }
          foreach ($culture in @("cs", "de", "es", "fr", "it", "ja", "ko", "pl", "pt-BR", "ru", "tr", "zh-Hans", "zh-Hant")) {
            if (Test-Path -LiteralPath (Join-Path $publish $culture)) {
              throw "Release package should not contain unused satellite resource directory: $culture"
            }
          }
          $expectedVersion = "${{ github.ref_name }}".TrimStart("v")
          $actualVersion = (Get-Item (Join-Path $publish "LiveShelf.exe")).VersionInfo.ProductVersion
          if ($actualVersion -notlike "$expectedVersion*") {
            throw "LiveShelf.exe version '$actualVersion' does not match tag '$expectedVersion'"
          }

      - name: Zip package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $publish = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\LiveShelf-win-x64"
          $zip = Join-Path $env:GITHUB_WORKSPACE "artifacts\LiveShelf-$tag-win-x64.zip"
          Compress-Archive -Path (Join-Path $publish "*") -DestinationPath $zip -Force
          if (!(Test-Path -LiteralPath $zip)) {
            throw "Release zip was not created"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipEntries = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entryNames = $zipEntries.Entries | ForEach-Object { $_.FullName.Replace("/", "\") }
            foreach ($name in @("LiveShelf.exe", "liveshelf-agent.exe", "liveshelf-bridge.exe")) {
              if ($entryNames -notcontains $name) {
                throw "Release zip missing: $name"
              }
            }
          }
          finally {
            $zipEntries.Dispose()
          }
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: LiveShelf-${{ github.ref_name }}-win-x64
          path: ${{ env.RELEASE_ZIP }}

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:RELEASE_ZIP" `
            --title "Live Shelf ${{ github.ref_name }}" `
            --notes "Windows x64 self-contained beta build. Download the zip, extract it, and run LiveShelf.exe. This beta is not code-signed, so Windows SmartScreen may warn on first launch."
